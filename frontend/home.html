<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Virtual Dressing Room</title>

<link rel="stylesheet" href="css/home.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<header>

<div class="logo-section">

<img src="image/logo.png">

<h2>AI Virtual Dressing Room</h2>

</div>

<div class="profile">

<i class="fa-solid fa-user-circle"></i>

<button onclick="logout()">Logout</button>

</div>

</header>

<main>

<h1>Welcome 👋</h1>

<p>Select any feature below</p>

<div class="grid">

<a href="scanner.html" class="card">

<i class="fa-solid fa-qrcode"></i>

<h3>QR Scanner</h3>

<p>Scan retailer QR</p>

</a>

<a href="link.html" class="card">

<i class="fa-solid fa-link"></i>

<h3>Website Link</h3>

<p>Paste shopping link</p>

</a>

<a href="tryon.html" class="card">

<i class="fa-solid fa-shirt"></i>

<h3>AI Try-On</h3>

<p>Upload & Try Dress</p>

</a>

<a href="history.html" class="card">

<i class="fa-solid fa-clock-rotate-left"></i>

<h3>History</h3>

<p>View previous try-ons</p>

</a>

<a href="wishlist.html" class="card">

<i class="fa-solid fa-heart"></i>

<h3>Wishlist</h3>

<p>Saved Dresses</p>

</a>

<a href="profile.html" class="card">

<i class="fa-solid fa-user"></i>

<h3>Profile</h3>

<p>Manage account</p>

</a>

</div>

</main>

<footer>

<a href="home.html">
<i class="fa-solid fa-house"></i>
Home
</a>

<a href="scanner.html">
<i class="fa-solid fa-qrcode"></i>
Scan
</a>

<a href="tryon.html">
<i class="fa-solid fa-shirt"></i>
Try-On
</a>

<a href="history.html">
<i class="fa-solid fa-clock"></i>
History
</a>

<a href="profile.html">
<i class="fa-solid fa-user"></i>
Profile
</a>

</footer>

<script src="js/home.js"></script>

</html>
