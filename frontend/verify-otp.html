<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verify OTP</title>

    <link rel="stylesheet" href="css/verify-otp.css">

</head>

<body>

<div class="container">

    <div class="card">

        <h2>Verify OTP</h2>

        <p>
            Enter the 6-digit OTP sent to your email.
        </p>

        <div class="otp-box">

            <input type="text" maxlength="1" class="otp">
            <input type="text" maxlength="1" class="otp">
            <input type="text" maxlength="1" class="otp">
            <input type="text" maxlength="1" class="otp">
            <input type="text" maxlength="1" class="otp">
            <input type="text" maxlength="1" class="otp">

        </div>

        <button id="verifyBtn">

            Verify OTP

        </button>

        <div class="timer">

            <span id="countdown">

                Resend OTP in 60s

            </span>

        </div>

        <button id="resendBtn" disabled>

            Resend OTP

        </button>

    </div>

</div>

<script src="js/verify-otp.js"></script>

</body>
</html>
